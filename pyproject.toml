[project]
name = "retail-calendar"
version = "1.0.0"
description = "A configurable retail (4-5-4, 4-4-5, 5-4-4) calendar. Python port of the retail-calendar npm package."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Toolio" }]
keywords = ["retail", "calendar", "merchandise", "4-5-4", "nrf", "fiscal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_calendar"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "scripts", "README.md", "LICENSE"]
exclude = ["scripts/golden/node_modules"]

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "N", "D", "ANN", "PL", "PERF", "TID",
]
ignore = [
    "D100", "D104", "D105", "D107",  # module/package/magic/__init__ docstrings
    "D203", "D213",                  # conflicting docstring styles (use D211, D212)
    "D401",                          # docstrings describe what is returned ("The week containing ...")
    "PLR2004",                       # magic values are clearer than named constants for calendar math
    "PLR0913",                       # dataclass-like constructors
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "PLR"]
"scripts/**" = ["D", "T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["retail_calendar"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ["if TYPE_CHECKING:", "assert_never\\(", "\\.\\.\\."]
