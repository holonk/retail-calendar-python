name: Release

# Pushing a v* tag runs CI, then publishes a GitHub Release with the wheel and sdist attached.
# Projects install the wheel from the release URL, pinned by its SHA-256 (see README).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Check the tag is on master and matches the package version
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "Tag $GITHUB_REF_NAME is not on master" >&2
            exit 1
          fi
          version="$(uv version --short)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match the package version $version" >&2
            exit 1
          fi
      - run: uv build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wheel="$(cd dist && ls *.whl)"
          sha256="$(sha256sum "dist/$wheel" | cut -d' ' -f1)"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$wheel"
          cat > notes.md <<NOTES
          Install with this line in requirements.txt:

          \`\`\`
          retail-calendar @ $url#sha256=$sha256
          \`\`\`
          NOTES
          # With assets, gh uploads them to a draft and publishes it only once they're all uploaded.
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
